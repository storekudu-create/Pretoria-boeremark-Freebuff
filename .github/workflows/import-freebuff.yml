name: Import Freebuff source

on:
  push:
    branches: [main]
    paths:
      - '.import/freebuff-source.tgz'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract uploaded Freebuff source
        shell: bash
        run: |
          set -euo pipefail
          test -f .import/freebuff-source.tgz
          tar -xzf .import/freebuff-source.tgz -C .
          rm -f .import/freebuff-source.tgz
          rmdir .import 2>/dev/null || true

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import Interactive Market Map from uploaded Freebuff ZIP"
          git push origin HEAD:main
